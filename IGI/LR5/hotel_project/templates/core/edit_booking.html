{% extends 'base.html' %}

{% block title %}Редактирование брони №{{ booking.id }}{% endblock %}

{% block content %}
  <h1>Редактирование брони №{{ booking.id }}</h1>
  <h2>Номер {{ room.number }} ({{ room.category }})</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Сохранить изменения</button>
    <a href="{% url 'core:staff_dashboard' %}" class="btn-secondary">Отмена</a>
  </form>
{% endblock %}
